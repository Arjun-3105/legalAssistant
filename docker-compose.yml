version: "3.8"

services:
  legal-ai:
    build: .
    container_name: roberta-legal-ai
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ROBERTA_MODEL_PATH=${ROBERTA_MODEL_PATH:-roberta-base}
      - CHROMA_PERSIST_DIR=/app/chroma_legal_store
    volumes:
      - chroma_data:/app/chroma_legal_store
      - hf_cache:/app/hf_cache
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  chroma_data:
    driver: local
  hf_cache:
    driver: local
